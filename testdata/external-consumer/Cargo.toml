[workspace]

[package]
name = "durable-host-consumer"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
crabber = { git = "ssh://git@github.com/mattsp1290/crabber.git", rev = "3ff793c982aa1fc31e5d3a2bbe459f753d7bbf8e" }
crabber-extensions = { git = "ssh://git@github.com/mattsp1290/crabber-extensions.git", rev = "EXTENSIONS_REV" }
# crabber-tools-catalog = { git = "ssh://git@github.com/mattsp1290/crabber-tools.git", rev = "TOOLS_REV", optional = true }
async-trait = "0.1"
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "process", "test-util"] }
tokio-util = "0.7"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["process"] }

[dev-dependencies]
jsonschema = { version = "0.58", default-features = false }

[features]
default = []
sqlite = ["crabber/sqlite"]
tools = []
