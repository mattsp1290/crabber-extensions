[workspace]
members = ["crates/extensions"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
crabber = { git = "ssh://git@github.com/mattsp1290/crabber.git", rev = "3ff793c982aa1fc31e5d3a2bbe459f753d7bbf8e" }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt", "sync", "time", "process", "io-util"] }

tokio-util = "0.7"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
