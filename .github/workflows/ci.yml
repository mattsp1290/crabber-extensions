name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.14"]
    runs-on: ${{ matrix.os }}
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v4
      - name: Configure HTTPS access to pinned Crabber source
        shell: bash
        run: |
          git config --global url.https://github.com/mattsp1290/crabber.git.insteadOf ssh://git@github.com/mattsp1290/crabber.git
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy
      - name: Formatting
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Verify process fixture tools
        shell: bash
        run: |
          test -x /bin/sh
          ps -A -o pid=,pgid=,stat= >/dev/null
          python3 --version
          python3 -c 'import sys; v = sys.version_info; assert (3, 11) <= (v.major, v.minor) <= (3, 14), v'
      - name: Tests
        env:
          BACKGROUND_JOBS_REQUIRE_SHELL: "1"
          PYTHON_REPL_REQUIRE_PYTHON: "1"
        run: cargo test --workspace --locked
      - name: Documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --locked
